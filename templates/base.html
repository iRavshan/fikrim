<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Fikrim{% endblock %}</title>
    <style>
        /* ---- Ranglar tizimi ---------------------------------------------- */
        :root {
            --bg: #fbfbfc;
            --surface: #ffffff;
            --surface-2: #f4f4f6;
            --text: #17171c;
            --muted: #6e6e79;
            --border: #e8e8ec;

            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #eef0fe;
            --on-accent: #ffffff;

            --danger: #cc1f1f;
            --danger-soft: #fef2f2;
            --on-danger: #ffffff;
            --success: #047857;
            --success-soft: #ecfdf5;

            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 2px rgba(16, 16, 26, 0.04), 0 4px 16px rgba(16, 16, 26, 0.04);
            --ring: 0 0 0 3px var(--accent-soft);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e11;
                --surface: #16161a;
                --surface-2: #1e1e24;
                --text: #ececf1;
                --muted: #9b9ba6;
                --border: #26262e;

                --accent: #7c76f0;
                --accent-hover: #918cf5;
                --accent-soft: #1a182e;
                --on-accent: #0e0e11;

                --danger: #f87171;
                --danger-soft: #2a1618;
                --on-danger: #0e0e11;
                --success: #34d399;
                --success-soft: #10281f;

                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.2);
            }
        }

        /* ---- Asos --------------------------------------------------------- */
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            letter-spacing: -0.02em;
            line-height: 1.25;
        }
        h2 { font-size: 1.5rem; font-weight: 650; }
        h3 { font-size: 1.05rem; font-weight: 600; }

        a { color: var(--accent); }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ---- Sarlavha ----------------------------------------------------- */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0.9rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 1.05rem;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
        }
        .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #22d3ee));
            color: var(--on-accent);
            display: grid;
            place-items: center;
            font-size: 0.8rem;
            font-weight: 700;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
        }
        nav a:hover { color: var(--text); }
        .nav-user {
            font-size: 0.875rem;
            color: var(--muted);
            padding-right: 0.25rem;
        }

        /* ---- Karta -------------------------------------------------------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow);
        }
        .card-hover {
            transition: border-color 0.15s ease, transform 0.15s ease;
        }
        .card-hover:hover {
            border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
            transform: translateY(-2px);
        }

        /* ---- Tugmalar ----------------------------------------------------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            background: var(--accent);
            color: var(--on-accent);
            padding: 0.55rem 1rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 550;
            font-family: inherit;
            border: 1px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .btn:hover { background: var(--accent-hover); }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
        }
        .btn-outline:hover {
            background: var(--surface-2);
            border-color: color-mix(in srgb, var(--text) 20%, var(--border));
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border-color: transparent;
            padding-left: 0.6rem;
            padding-right: 0.6rem;
        }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text); }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: color-mix(in srgb, var(--danger) 30%, transparent);
        }
        .btn-danger:hover {
            background: var(--danger-soft);
            border-color: var(--danger);
        }

        .btn-danger-solid {
            background: var(--danger);
            color: var(--on-danger);
            border-color: transparent;
        }
        .btn-danger-solid:hover {
            background: color-mix(in srgb, var(--danger) 85%, #000);
        }

        .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
        .btn-block { width: 100%; }

        /* ---- Formalar ----------------------------------------------------- */
        .form-group { margin-bottom: 1.1rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 550;
            font-size: 0.85rem;
            color: var(--text);
        }
        /* .form-input — o'z formalarimiz; qolgan selektorlar Django'ning
           standart auth formalari uchun (ularda klass qo'yilmaydi) */
        .form-input,
        form input[type="text"],
        form input[type="password"],
        form input[type="email"],
        form textarea,
        form select {
            width: 100%;
            padding: 0.65rem 0.8rem;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .form-input::placeholder,
        form input::placeholder,
        form textarea::placeholder { color: var(--muted); }

        .form-input:focus,
        form input[type="text"]:focus,
        form input[type="password"]:focus,
        form input[type="email"]:focus,
        form textarea:focus,
        form select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: var(--ring);
        }
        .form-input[readonly],
        form input[readonly] {
            background: var(--surface-2);
            color: var(--muted);
        }
        select.form-input,
        form select {
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                              linear-gradient(135deg, var(--muted) 50%, transparent 50%);
            background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 2.2rem;
        }

        .helptext {
            font-size: 0.78rem;
            line-height: 1.5;
            color: var(--muted);
            margin: 0.35rem 0 0;
        }
        /* Django parol qoidalarini <ul> ko'rinishida beradi */
        .helptext ul {
            margin: 0;
            padding-left: 1.1rem;
        }
        ul.errorlist {
            list-style: none;
            margin: 0.4rem 0 0;
            padding: 0.5rem 0.75rem;
            background: var(--danger-soft);
            border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
            border-radius: var(--radius-sm);
            color: var(--danger);
            font-size: 0.82rem;
        }

        /* ---- Kichik elementlar -------------------------------------------- */
        .chip {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 550;
            color: var(--muted);
            background: var(--surface-2);
            border-radius: 999px;
            padding: 0.2rem 0.65rem;
        }
        .chip-accent {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .note {
            font-size: 0.85rem;
            background: var(--accent-soft);
            color: var(--text);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            padding: 0.9rem 1rem;
            text-align: left;
        }
        .back-link {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--text); }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.75rem;
        }
        .page-head h2 { margin: 0; }

        .divided > * + * { border-top: 1px solid var(--border); }
        .feedback-item { padding: 0.9rem 0; }
        .feedback-item p { margin: 0 0 0.35rem; }

        .empty {
            text-align: center;
            padding: 3.5rem 1.5rem;
        }

        /* ---- Yordamchilar -------------------------------------------------- */
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); }
        .text-sm { font-size: 0.875rem; }
        .mb-0 { margin-bottom: 0; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 1.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .narrow { max-width: 460px; margin-left: auto; margin-right: auto; }
        .medium { max-width: 620px; margin-left: auto; margin-right: auto; }

        @media (max-width: 640px) {
            .container { padding: 1.5rem 1rem 3rem; }
            .header-inner { padding: 0.75rem 1rem; }
            .page-head { flex-direction: column; align-items: stretch; }
            .page-head .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="{% url 'dashboard' %}" class="brand">
                <span class="brand-mark">F</span>
                Fikrim
            </a>
            <nav>
                {% if user.is_authenticated %}
                    <span class="nav-user">{{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-ghost btn-sm">Chiqish</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Kirish</a>
                    <a href="{% url 'register' %}" class="btn btn-sm">Ro'yxatdan o'tish</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <div class="container">
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
